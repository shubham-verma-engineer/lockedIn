# DataSource configuration - In-Memory H2 for local dev/testing
spring.datasource.url=jdbc:h2:mem:lockedindb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automated schema initialization from schema.sql
spring.sql.init.mode=always

# Enable H2 Web Console for local dev inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ElevenLabs Integration (Simulated in Dev Mode)
elevenlabs.api.key=mock-dev-key
elevenlabs.voice.url=https://api.elevenlabs.io/v1/text-to-speech/{voice_id}
elevenlabs.simulated=true
