# DataSource configuration - Production PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Schema initialization disabled (handled via migration scripts / DDL pipeline)
spring.sql.init.mode=never

# Disable H2 console in production
spring.h2.console.enabled=false

# ElevenLabs Integration (Real API Client in Production Mode)
elevenlabs.api.key=${ELEVENLABS_API_KEY}
elevenlabs.voice.url=https://api.elevenlabs.io/v1/text-to-speech/{voice_id}
elevenlabs.simulated=false
